# Configuration template (see app/config.py for validation rules)
#
# Copy this file to config.toml at the repository root and adjust as needed.
# AI-Hub configuration belongs exclusively to AI-Hub.
# Raw secrets are never stored here - secret-like keys are rejected at load time.

[database]
path = "database/ai_hub.db"

[monitoring]
enabled = true
interval_minutes = 60
# Per-check HTTP timeout in seconds.
timeout_seconds = 10
# Consecutive check failures that mark a provider DEGRADED.
failure_threshold = 3
# Response time above this (milliseconds) is treated as high latency.
latency_threshold_ms = 10000

[scoring]
# Score aging boundaries in days (v1.2 Section 4). Must be strictly increasing.
aging_fresh_days = 30
aging_aging_days = 90
aging_old_days = 180
# When true, operational dimensions (availability, reliability, latency) are
# derived from current monitoring data at recommendation time (never stored).
derive_operational = true

[fallback]
max_chain_length = 5

[recommendation]
default_profile = "coding"
decision_version = "3.0.0"

[dashboard]
refresh_seconds = 60

[discovery]
# Phase 6 ecosystem discovery (ADR-0005 / D-P1). Master switch for candidate
# acquisition (curated import and network fetch). Review (list/approve/reject)
# stays available regardless.
enabled = false
# Explicit allowlist for controlled network metadata fetch (D-P2). Empty =
# network disabled. Never add credentials/private endpoints here.
allowlisted_urls = []
# Per-fetch HTTP timeout in seconds for `discovery run`.
timeout_seconds = 10
# Default curated import location (JSON patch files) used when `discovery
# import` is given no explicit path.
import_dir = "data/discovery"

[benchmark]
# Phase 6 benchmark ingestion (ADR-0006 / D-P3). Default curated import
# location used when `benchmark import` is given no explicit path.
import_dir = "data/benchmarks"

[logging]
level = "INFO"
log_root = "logs"

# Machine-specific example default - configure per machine, never hardcode.
# Paths are never project identity (R-03).
[workspace]
root = "M:\\dev"

[registry]
path = "projects/registry.json"
